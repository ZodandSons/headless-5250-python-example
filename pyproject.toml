[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "headless5250"
dynamic = ["version"]
description = "Headless, scriptable TN5250 client for IBM i, with an MCP server for AI assistants such as IBM Bob"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "JCW Consulting Services" }]
keywords = ["5250", "tn5250", "ibm i", "as400", "iseries", "green screen", "automation", "mcp", "ibm bob"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
h5250 = "headless5250.cli:main"
h5250-mcp = "headless5250.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "headless5250.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
